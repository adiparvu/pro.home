name: iOS — TestFlight Deploy

on:
  push:
    branches: [main, claude/prv-house-vision-bjnc7z, claude/prv-house-vision-rh9ezh]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install iOS platform
        run: |
          xcodebuild -version
          for i in 1 2 3; do
            sudo xcodebuild -downloadPlatform iOS && sudo xcodebuild -downloadPlatform watchOS && break
            echo "downloadPlatform attempt $i failed, retrying..."
            sleep 10
          done || echo "downloadPlatform failed; continuing — platform is usually preinstalled"

      - name: Cache Gems
        uses: actions/cache@v4
        with:
          path: apps/ios/vendor/bundle
          key: gems-${{ hashFiles('apps/ios/Gemfile.lock') }}
          restore-keys: gems-

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('apps/ios/project.yml') }}
          restore-keys: spm-

      - name: Cache DerivedData (SPM compiled modules)
        uses: actions/cache@v4
        with:
          path: /tmp/DerivedData/SourcePackages
          key: dd-spm-${{ hashFiles('apps/ios/project.yml') }}
          restore-keys: dd-spm-

      - name: Install Gems
        run: |
          bundle config set path vendor/bundle
          bundle install

      - name: Run Fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          IOS_DIST_CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          IOS_DIST_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
        run: bundle exec fastlane beta

  test:
    name: Unit Tests
    runs-on: macos-26
    timeout-minutes: 35

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install iOS platform
        run: |
          xcodebuild -version
          for i in 1 2 3; do
            sudo xcodebuild -downloadPlatform iOS && sudo xcodebuild -downloadPlatform watchOS && break
            echo "downloadPlatform attempt $i failed, retrying..."
            sleep 10
          done || echo "downloadPlatform failed; continuing — platform is usually preinstalled"

      - name: Cache SPM packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('apps/ios/project.yml') }}
          restore-keys: spm-

      - name: Generate project
        run: xcodegen generate

      - name: Run unit tests on a simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/^ *(.+) \([0-9A-Fa-f-]+\) \(.*/\1/' | xargs)
          if [ -z "$DEVICE" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "Using simulator: $DEVICE"
          set -o pipefail
          xcodebuild test \
            -project PRVIO.xcodeproj \
            -scheme PRVIO \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath /tmp/TestDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | awk '/Test Suite|Test Case|error:|\*\* TEST/'
          # awk is display-only and always exits 0, so with pipefail the
          # step's verdict is xcodebuild's real exit code — never swallowed.
