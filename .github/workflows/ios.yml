name: iOS — TestFlight Deploy

on:
  push:
    branches: [main, claude/prv-house-vision-bjnc7z]
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15

    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/ios

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install iOS platform
        run: |
          xcodebuild -version
          for i in 1 2 3; do
            sudo xcodebuild -downloadPlatform iOS && break
            echo "downloadPlatform attempt $i failed, retrying..."
            sleep 10
          done || echo "downloadPlatform failed; continuing — platform is usually preinstalled"

      - name: Cache Gems
        uses: actions/cache@v4
        with:
          path: apps/ios/vendor/bundle
          key: gems-${{ hashFiles('apps/ios/Gemfile.lock') }}
          restore-keys: gems-

      - name: Install Gems
        run: bundle install --path vendor/bundle

      - name: Run Fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: bundle exec fastlane beta
