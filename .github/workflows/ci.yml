name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: pnpm exec next build

  e2e:
    name: E2E smoke (skipped without secrets)
    runs-on: ubuntu-latest
    needs: build
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        id: gate
        run: |
          if [ -z "$E2E_EMAIL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "E2E secrets not configured — skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Build & start app
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/web
        run: |
          pnpm exec next build
          pnpm exec next start --port 3000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && break
            sleep 2
          done

      - name: Run E2E tests
        if: steps.gate.outputs.run == 'true'
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000
        run: pnpm exec playwright test

      - name: Upload traces on failure
        if: failure() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
