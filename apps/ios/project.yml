name: PRVHouse
options:
  bundleIdPrefix: com.prvhouse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  swift: "5.10"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  PRVHouse:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    dependencies:
      - package: Supabase
        product: Auth
      - package: Supabase
        product: PostgREST
      - package: Supabase
        product: Realtime
      - package: Supabase
        product: Storage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prvhouse.app
        SWIFT_VERSION: 5.10
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_FILE: Sources/App/Info.plist
        DEVELOPMENT_TEAM: SU92TVZT8W
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
