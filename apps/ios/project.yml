name: PRVIO
options:
  bundleIdPrefix: com.prvio
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  swift: "5.10"
  createIntermediateGroups: true
  developmentLanguage: ro

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  PRVIO:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: Supabase
        product: Supabase
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework
      - sdk: EventKit.framework
      - sdk: UserNotifications.framework
      - sdk: Vision.framework
      - sdk: RoomPlan.framework
      - sdk: QuickLook.framework
      - sdk: ARKit.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: AppIntents.framework
      - sdk: CoreSpotlight.framework
      - sdk: BackgroundTasks.framework
      - sdk: Charts.framework
      - sdk: Contacts.framework
      - sdk: ContactsUI.framework
      - sdk: Photos.framework
      - sdk: PhotosUI.framework
      - sdk: WeatherKit.framework
      - sdk: CoreNFC.framework
      - sdk: HomeKit.framework
      - sdk: PassKit.framework
      - sdk: GroupActivities.framework
      - sdk: FamilyControls.framework
      - sdk: AuthenticationServices.framework
      - sdk: CloudKit.framework
      - target: PRVIOWidgets
    entitlements:
      path: Sources/App/PRVIO.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.prvio.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prvio.app
        SWIFT_VERSION: 5.10
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_FILE: Sources/App/Info.plist
        DEVELOPMENT_TEAM: SU92TVZT8W
        CODE_SIGN_STYLE: Manual
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "366"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        STRINGS_FILE_INPUT_ENCODING: UTF-8
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule

  PRVIOWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/Services/SharedDataStore.swift
      - path: Sources/Intents/PRVIOEntities.swift
      - path: Sources/Intents/TaskIntents.swift
      - path: Sources/Intents/PlantIntents.swift
      - path: Sources/LiveActivities/PRVIOLiveActivities.swift
    resources:
      - path: Resources/Localizable.xcstrings
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework
      - sdk: ActivityKit.framework
    entitlements:
      path: Sources/App/PRVIO.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.prvio.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prvio.app.widgets
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_FILE: Widgets/Info.plist
        DEVELOPMENT_TEAM: SU92TVZT8W
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "366"
        STRINGS_FILE_INPUT_ENCODING: UTF-8
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
